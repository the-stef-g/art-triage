name: Build art-triage

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: art-triage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify at least one AI model candidate exists on Hugging Face
        run: |
          kandidater="onnx-community/siglip2-base-patch16-224-ONNX"
          ok=0
          for repo in $kandidater; do
            mangler=0; ukendt=0
            for f in config.json tokenizer.json preprocessor_config.json onnx/text_model_quantized.onnx onnx/vision_model_quantized.onnx; do
              url="https://huggingface.co/$repo/resolve/main/$f"
              code=$(curl -s -o /dev/null -w "%{http_code}" -L -r 0-0 "$url")
              echo "$code  $url"
              case "$code" in
                200|206) ;;
                401|403|429) ukendt=1 ;;
                *) mangler=1 ;;
              esac
            done
            if [ "$mangler" = "0" ] && [ "$ukendt" = "0" ]; then
              echo "OK: $repo er komplet"
              ok=1
            elif [ "$mangler" = "0" ]; then
              echo "UKENDT (kvote/auth): $repo kan ikke verificeres herfra"
              ok=1
            else
              echo "MANGLER: $repo er ikke komplet"
            fi
          done
          if [ "$ok" = "0" ]; then
            echo "FEJL: ingen af modelkandidaterne findes komplet" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check that every ORT wasm file is bundled
        run: node scripts/check-ort-assets.mjs
      - name: Smoke test (Electron under Xvfb)
        run: xvfb-run --auto-servernum npm run smoke
        timeout-minutes: 8
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
      # Smoke-testen koerer fra kildemappen og ser derfor aldrig hvad
      # electron-builder pakker. Her pakkes appen, og sharp indlaeses fra
      # den pakkede asar, saa en sharp der faldt ud af pakken fanges her.
      - name: Pack for Linux and load sharp from the packed app
        run: |
          npx electron-builder --linux dir --x64 --publish never -c.directories.output=release-linux
          node scripts/check-packaged-sharp.mjs release-linux/linux-unpacked/resources linux-x64
          ELECTRON_RUN_AS_NODE=1 ELECTRON_DISABLE_SANDBOX=1 release-linux/linux-unpacked/art-triage -e "
            const sharp = require('./release-linux/linux-unpacked/resources/app.asar/node_modules/sharp');
            sharp({ create: { width: 300, height: 200, channels: 3, background: '#0963c7' } }).tiff().toBuffer()
              .then((b) => sharp(b).resize(100, 100, { fit: 'inside' }).jpeg().toBuffer())
              .then((o) => console.log('packed sharp ok,', o.length, 'bytes'))
              .catch((e) => { console.error('packed sharp FAILED:', e.message); process.exit(1); });
          "
        timeout-minutes: 6
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: smoke-*.png
          if-no-files-found: ignore

  build-mac:
    name: Build macOS app (Intel x64)
    runs-on: macos-latest
    timeout-minutes: 25
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Runneren er ikke nødvendigvis Intel. sharp henter sin binær efter
      # maskinens processor, saa x64-binaeren til Intel-Macen skal hentes
      # udtrykkeligt, ellers pakkes en arm64-binaer ind i en x64-app.
      - name: Fetch the x64 build of sharp
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/sharp'].version")
          npm install --no-save --ignore-scripts --os=darwin --cpu=x64 "sharp@$v"
      - run: npm run dist:mac
      - name: Check that sharp is packaged, unpacked and built for Intel
        run: |
          rm -rf release/check && mkdir -p release/check
          unzip -q release/art-triage-mac-x64.zip -d release/check
          node scripts/check-packaged-sharp.mjs "release/check/Art Triage.app/Contents/Resources" darwin-x64
      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: art-triage-mac-x64
          path: release/art-triage-mac-x64.zip
