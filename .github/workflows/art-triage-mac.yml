name: Build Stef G Art

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# contents: write lader Mac-bygningen lægge appen som en Release.
permissions:
  contents: write

concurrency:
  group: art-triage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify at least one AI model candidate exists on Hugging Face
        run: |
          kandidater="onnx-community/siglip2-base-patch16-224-ONNX"
          ok=0
          for repo in $kandidater; do
            mangler=0; ukendt=0
            for f in config.json tokenizer.json preprocessor_config.json onnx/text_model_quantized.onnx onnx/vision_model_quantized.onnx; do
              url="https://huggingface.co/$repo/resolve/main/$f"
              code=$(curl -s -o /dev/null -w "%{http_code}" -L -r 0-0 "$url")
              echo "$code  $url"
              case "$code" in
                200|206) ;;
                401|403|429) ukendt=1 ;;
                *) mangler=1 ;;
              esac
            done
            if [ "$mangler" = "0" ] && [ "$ukendt" = "0" ]; then
              echo "OK: $repo er komplet"
              ok=1
            elif [ "$mangler" = "0" ]; then
              echo "UKENDT (kvote/auth): $repo kan ikke verificeres herfra"
              ok=1
            else
              echo "MANGLER: $repo er ikke komplet"
            fi
          done
          if [ "$ok" = "0" ]; then
            echo "FEJL: ingen af modelkandidaterne findes komplet" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check that every ORT wasm file is bundled
        run: node scripts/check-ort-assets.mjs
      - name: Smoke test (Electron under Xvfb)
        run: xvfb-run --auto-servernum npm run smoke
        timeout-minutes: 8
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
      - name: Smoke test of cropping (a new file in Master)
        run: xvfb-run --auto-servernum npm run smoke:crop
        timeout-minutes: 5
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
      - name: Smoke test of previews (RAW, TIFF, failed and retried)
        run: xvfb-run --auto-servernum npm run smoke:previews
        timeout-minutes: 5
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
      # Smoke-testen koerer fra kildemappen og ser derfor aldrig hvad
      # electron-builder pakker. Her pakkes appen, og sharp indlaeses fra
      # den pakkede asar, saa en sharp der faldt ud af pakken fanges her.
      - name: Pack for Linux and load sharp from the packed app
        run: |
          npx electron-builder --linux dir --x64 --publish never -c.directories.output=release-linux
          node scripts/check-packaged-sharp.mjs release-linux/linux-unpacked/resources linux-x64
          node scripts/load-packed-sharp.mjs release-linux/linux-unpacked/art-triage release-linux/linux-unpacked
        timeout-minutes: 8
      # Skaermbillederne er kun til at finde fejl med, saa de gemmes kun naar
      # en test fejler, og kun kort. En fuld lagerkvote maa ikke faelde en
      # koersel hvor alle test er gaaet igennem.
      - name: Upload smoke screenshots
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: smoke-*.png
          if-no-files-found: ignore
          retention-days: 3

  # Paa main er koden som regel præcis den, der lige er bygget paa grenen
  # (main flettes frem til grenen). Saa laves grenens pre-release bare om
  # til den seneste udgave, i stedet for at vente paa en Mac igen. Kun hvis
  # der er aendret kode siden (andet end tekst, docs og selve workflowet),
  # bygges der forfra.
  promote:
    name: Promote the branch build (main only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      promoted: ${{ steps.p.outputs.promoted }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          fil="Stef-G-Art-$v-mac-arm64.zip"
          info=$(gh release view "$tag" --json targetCommitish,assets \
            -q '[.targetCommitish, (.assets | map(.name) | join(","))] | @tsv' 2>/dev/null || true)
          target=$(printf '%s' "$info" | cut -f1)
          assets=$(printf '%s' "$info" | cut -f2)
          if [ -n "$target" ] && [[ ",$assets," == *",$fil,"* ]] \
            && git diff --quiet "$target" "$GITHUB_SHA" -- . ':(exclude)*.md' ':(exclude)docs/**' ':(exclude).github/**'; then
            gh release edit "$tag" --prerelease=false --latest \
              --notes "Stef G Art $v for Apple Silicon Macs (M1 to M5). Download the zip below, unzip it and move Stef G Art to Applications."
            echo "Promoted $tag (built from $target)"
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "No matching pre-release for $tag; the Mac app is built."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          fi

  build-mac:
    name: Build macOS app (Apple Silicon arm64)
    # Appen er til en Apple Silicon-Mac (MacBook Air M5). Den bygges paa
    # GitHubs Intel-Macs og krydsbygges til arm64: de Apple Silicon-maskiner
    # bag macos-latest var saa travle, at jobbet gentagne gange blev opgivet
    # efter 15 minutter uden at faa en maskine.
    runs-on: macos-15-intel
    timeout-minutes: 25
    needs: [test, promote]
    # Paa en gren springes promote over; paa main kun naar den ikke fandt
    # en faerdig pre-release at bruge.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.promote.outputs.promoted != 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # sharp henter sin binaer efter maskinens processor, saa arm64-
      # binaeren til Apple Silicon skal hentes udtrykkeligt paa en Intel-
      # runner, ellers pakkes en x64-binaer ind i en arm64-app.
      - name: Fetch the arm64 build of sharp
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/sharp'].version")
          npm install --no-save --ignore-scripts --os=darwin --cpu=arm64 "sharp@$v"
      - run: npm run dist:mac
      # Apple Silicon koerer kun signerede programmer. Uden en Apple-
      # udviklerkonto signeres appen ad hoc ("-") efter pakningen, og zip-
      # filen laves igen. Tjekket ser ogsaa efter, at hovedprogrammet er arm64.
      - name: Sign the app ad hoc for Apple Silicon
        run: |
          rm -rf release/sign && mkdir -p release/sign
          ditto -x -k release/stef-g-art-mac-arm64.zip release/sign
          codesign --force --deep --sign - "release/sign/Stef G Art.app"
          rm release/stef-g-art-mac-arm64.zip
          ditto -c -k --keepParent "release/sign/Stef G Art.app" release/stef-g-art-mac-arm64.zip
      - name: Check that sharp is packaged, unpacked and built for Apple Silicon, and the app is signed
        run: |
          rm -rf release/check && mkdir -p release/check
          ditto -x -k release/stef-g-art-mac-arm64.zip release/check
          node scripts/check-packaged-sharp.mjs "release/check/Stef G Art.app/Contents/Resources" darwin-arm64
          lipo -archs "release/check/Stef G Art.app/Contents/MacOS/Stef G Art" | grep -qx arm64
          codesign --verify --deep --strict --verbose=2 "release/check/Stef G Art.app"
      # Appen lægges som en GitHub Release, én pr. version (v0.15.0 osv.).
      # Release-filer tæller ikke med i Actions-kvoten, som de gamle
      # artifacts fyldte op. En bygning fra en gren er en pre-release til
      # afproevning; naar den samme version kommer paa main, bliver den den
      # seneste udgave. Releasen laves forfra hver gang, saa den altid peger
      # paa den commit appen er bygget af.
      - name: Publish the app as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          fil="release/Stef-G-Art-$v-mac-arm64.zip"
          cp release/stef-g-art-mac-arm64.zip "$fil"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            hvad="--latest"
            noter="Stef G Art $v for Apple Silicon Macs (M1 to M5). Download the zip below, unzip it and move Stef G Art to Applications."
          else
            hvad="--prerelease"
            noter="Test build of Stef G Art $v from $GITHUB_REF_NAME, for Apple Silicon Macs (M1 to M5). It becomes the latest release when it is merged into main."
          fi
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" "$fil" --target "$GITHUB_SHA" --title "Stef G Art $v" --notes "$noter" $hvad
